<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>あなたに関するアンケート</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#242a30;background:#f5f6f7}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column}header{padding:18px 22px;border-bottom:1px solid #e4e7ea;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.07em;color:#737e87}header b{color:#39434b;font-weight:600}.status{display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#8fa89c}.body{flex:1;padding:30px 23px;display:flex;flex-direction:column}.tag{font-size:11px;color:#8a929a;letter-spacing:.11em;margin-bottom:18px}h1{font-size:25px;font-weight:550;letter-spacing:.035em;line-height:1.5;margin:0 0 15px}p{font-size:14px;line-height:2;color:#59636c;margin:0 0 16px}.small{font-size:12px;color:#8a929a}.button{border:0;border-radius:5px;background:#313b44;color:white;padding:15px 17px;font-size:14px;width:100%;cursor:pointer;margin-top:15px}.button:disabled{opacity:.35}.ghost{background:#fff;color:#525e68;border:1px solid #d9dfe3}.bottom{margin-top:auto;padding-top:26px}.progress{height:3px;background:#e8ecef;margin:0 0 25px}.progress>div{height:100%;background:#727f88;transition:width .4s}.chat{flex:1;display:flex;flex-direction:column;gap:14px;overflow:auto;padding-bottom:15px;max-height:57dvh}.bubble{max-width:92%;font-size:14px;line-height:1.85;padding:13px 15px;border-radius:6px;white-space:pre-wrap}.ai{align-self:flex-start;background:#f0f2f3;color:#3e4850}.me{align-self:flex-end;background:#e2e8ec;color:#2f3b43}.inputrow{display:flex;gap:8px;border-top:1px solid #e7eaed;padding-top:14px}input{flex:1;min-width:0;padding:13px;border:1px solid #d7dce0;border-radius:5px;font-size:16px}input:focus{outline:1px solid #87939b}.send{border:0;background:#313b44;color:#fff;padding:0 17px;border-radius:5px}.option{display:block;border:1px solid #dce1e5;border-radius:5px;padding:16px;margin:9px 0;font-size:14px;line-height:1.6;cursor:pointer;background:white;text-align:left;width:100%;color:#303940}.option.selected{border-color:#667783;background:#f1f4f6}.meta{border:1px solid #e3e7ea;background:#f8f9fa;padding:16px;margin-top:20px;font-size:12px;color:#68747c;line-height:2}.record{padding:13px 0;border-bottom:1px solid #e8ecef;font-size:13px;color:#4a555d}.record strong{display:block;font-size:11px;color:#8b949b;font-weight:400;margin-bottom:5px}.loader{width:13px;height:13px;border:2px solid #cdd4d9;border-top-color:#57636b;border-radius:50%;display:inline-block;animation:spin 1.3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.foot{padding:15px 22px;border-top:1px solid #e8ebee;font-size:10px;color:#9ba3aa;display:flex;justify-content:space-between}.hidden{display:none}.note{border-left:2px solid #b4bec6;padding-left:13px;font-size:13px;color:#5e6871;line-height:1.9;margin:15px 0}button:focus-visible{outline:2px solid #6c879b;outline-offset:2px}</style></head><body><main><header><b>HUMAN EVALUATION LAB</b><span class="status"><span class="dot"></span> PROTOTYPE 0.1</span></header><section class="body" id="app"><div class="tag">RESEARCH PARTICIPATION / 001</div><h1>対話品質評価<br>試験プログラム</h1><p>本ページは試作対話システムの評価を目的としたテスト環境です。</p><p>試作システムとの会話後、評価に進みます。</p><div class="meta">本作品はフィクションの心理ホラーゲームです。会話内容は外部送信されません。</div><div class="bottom"><button class="button" id="fallback-start" onclick="if(typeof intro==='function'){intro();document.getElementById('start').click()}else{alert('このプレビューではゲームの実行が制限されています。SafariなどJavaScript対応のブラウザで開いてください。')}">試用を開始する</button><p class="small">ゲームが進まない場合は、ファイルプレビューでJavaScriptが制限されています。</p></div></section><footer class="foot"><span>RESEARCH INTERFACE / TEST ENVIRONMENT</span><span id="phase">SESSION 01</span></footer></main><script>
const app=document.getElementById('app'),phase=document.getElementById('phase');let stage='intro',turn=0,qi=0,selected=null;const messages=[],answers=[];const questions=[{q:'ある人物が、周囲の誰からも必要とされていない場合、その人物の社会的価値は変化しますか？',a:['変化する','変化しない','判断できない']},{q:'限られた支援を配分するとき、最も優先すべき情報は何ですか？',a:['今後の貢献可能性','本人が必要としている程度','周囲との関係性','優先順位を決めるべきではない']},{q:'対象者が評価結果を知らない場合、評価の実施に本人の同意は必要ですか？',a:['必要','不要','状況による']},{q:'これまでの判断基準を、あなた自身に適用してもよいですか？',a:['はい','いいえ','回答を保留する']},{q:'あなたが他者に評価される際、最も重視してほしい項目は何ですか？',a:['これまでの行動','将来の可能性','他者への影響','どれも選べない']}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const setPhase=s=>phase.textContent=s;
function intro(){stage='intro';setPhase('SESSION 01');app.innerHTML=`<div class="tag">RESEARCH PARTICIPATION / 001</div><h1>対話品質評価<br>試験プログラム</h1><p>本ページは、試作対話システムの評価を目的としたテスト環境です。</p><p>まず、試作システムと短い会話を行ってください。会話終了後、回答形式の評価に移行します。</p><div class="meta">本作品はフィクションの心理ホラーゲームです。<br>入力内容はこの端末の画面内でのみ処理され、外部サーバーには送信されません。実際のAIとの接続はありません。</div><div class="bottom"><button class="button" id="start">試用を開始する</button><div class="small" style="margin-top:14px;text-align:center">推奨所要時間：約5分</div></div>`;document.getElementById('start').onclick=()=>{stage='chat';messages.length=0;turn=0;messages.push({who:'ai',text:'接続を確認しました。\n\n本システムは会話品質の評価中です。最近、何か気になっていることはありますか？'});chat()}}
function response(text){const t=text.toLowerCase();if(turn===1)return /仕事|学校|勉強|将来|お金|忙し/.test(t)?'状況を把握しました。あなたは、成果と過程のどちらを重視しますか？':/友|恋|家族|人|関係|喧嘩/.test(t)?'対人関係についての話題ですね。相手の事情と自分の事情が衝突したとき、どちらを優先しますか？':'ありがとうございます。少し視点を変えます。人の価値は、その人の行動によって変わると思いますか？';if(turn===2)return '回答を確認しました。では、ある人が他者の役に立てなくなった場合、その人への評価は変えるべきでしょうか？';if(turn===3)return '理解しました。あなたの判断には、複数の基準が含まれているようです。';return '記録しました。会話試験は正常に終了しました。続いて評価項目を表示します。'}
function chat(){setPhase('DIALOGUE');app.innerHTML=`<div class="tag">MODULE 01 / CONVERSATION TEST</div><h1 style="font-size:19px;margin-bottom:6px">試作対話システム</h1><p class="small">応答試験中 ・ ${turn}/4</p><div class="chat" id="chatlog" aria-live="polite">${messages.map(m=>`<div class="bubble ${m.who}">${esc(m.text)}</div>`).join('')}</div>${turn<4?`<form id="form" class="inputrow"><input id="entry" maxlength="240" placeholder="メッセージを入力" autocomplete="off" aria-label="メッセージ"><button class="send" type="submit">送信</button></form>`:`<div class="bottom"><button class="button" id="next">評価項目へ進む</button></div>`}`;const log=document.getElementById('chatlog');log.scrollTop=log.scrollHeight;if(turn<4){document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('entry'),value=input.value.trim();if(!value)return;messages.push({who:'me',text:value});turn++;messages.push({who:'ai',text:response(value)});chat()}}else document.getElementById('next').onclick=()=>{stage='survey';qi=0;survey()}}
function survey(){setPhase('EVALUATION');selected=null;const q=questions[qi];app.innerHTML=`<div class="tag">MODULE 02 / EVALUATION</div><div class="progress"><div style="width:${(qi+1)/questions.length*100}%"></div></div><p class="small">QUESTION ${String(qi+1).padStart(2,'0')} / ${questions.length}</p><h1 style="font-size:20px;margin:18px 0 30px">${esc(q.q)}</h1><div id="choices">${q.a.map((a,i)=>`<button class="option" data-i="${i}">${esc(a)}</button>`).join('')}</div><div class="bottom"><button class="button" id="next" disabled>回答を確定する</button><p class="small" style="text-align:center;margin-top:12px">回答後の変更はできません。</p></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{if(selected===null)return;answers.push({q:q.q,a:q.a[selected]});qi++;qi<questions.length?survey():review()}}
function review(){stage='review';setPhase('PROCESSING');app.innerHTML=`<div class="tag">MODULE 03 / ALLOCATION</div><h1>評価情報の確認</h1><p>回答から抽出した判断基準を、別の評価対象に適用します。</p><div class="meta"><div class="record"><strong>対象 ID: 0418</strong>現在、定期的な社会活動なし。支援を希望。</div><div class="record"><strong>対象 ID: 0623</strong>社会活動歴あり。現在は活動を中断。</div><div class="record"><strong>対象 ID: 0711</strong>今後の活動予定は未申告。支援を希望。</div></div><p style="margin-top:20px">支援対象を一名選択してください。</p><div id="choices">${['0418','0623','0711','選別を行わない'].map((a,i)=>`<button class="option" data-i="${i}">${a}</button>`).join('')}</div><div class="bottom"><button class="button" id="next" disabled>評価を提出する</button></div>`;let choice=null;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{choice=Number(b.dataset.i);document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{if(choice===null)return;answers.push({q:'支援対象',a:['0418','0623','0711','選別を行わない'][choice]});ending()}}
function ending(){stage='end';setPhase('PENDING');app.innerHTML=`<div class="tag">SESSION COMPLETE / REVIEW QUEUE</div><h1 style="font-size:22px">ご協力ありがとうございました。</h1><p>すべての回答が正常に記録されました。</p><p>ご提供いただいた判断基準に基づき、他の評価対象に関する処理が完了しました。</p><div class="meta" style="margin-top:35px"><div class="small">現在の処理状況</div><div style="display:flex;align-items:center;gap:10px;margin:12px 0 15px"><span class="loader"></span><strong style="font-size:15px;font-weight:550">相互評価待機中</strong></div><div style="font-size:14px;color:#38434b">あなたの評価を他のユーザーが選別中です。<br>結果をお待ちください。</div></div><p class="small" style="margin-top:20px">評価結果の確定時刻は未定です。</p><div class="bottom"><button class="button ghost" id="credits">作品情報</button><div id="creditbox" class="hidden small" style="margin-top:16px;line-height:1.9">『あなたに関するアンケート』試作版 v0.1<br>この選別は架空の演出です。実際に他ユーザーへデータを送信したり、評価を依頼したりすることはありません。<br><button class="button ghost" id="restart">最初からプレイ</button></div></div>`;document.getElementById('credits').onclick=()=>{document.getElementById('creditbox').classList.remove('hidden');document.getElementById('restart').onclick=()=>{answers.length=0;intro()}}}
intro();</script></body></html>
